spring:
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:}}
    username: ${DB_USER:${SPRING_DATASOURCE_USERNAME:}}
    password: ${DB_PASS:${SPRING_DATASOURCE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

server:
  port: ${PORT:${APP_PORT:8080}}
