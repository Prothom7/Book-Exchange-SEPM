<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Book Exchange</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">
<div class="bg-blur"></div>
<div class="bg-circle circle-one"></div>
<div class="bg-circle circle-two"></div>

<section class="auth-card">
    <div class="brand">
        <h1>Forgot Password</h1>
        <p>Enter your username or email and we will send a reset link.</p>
    </div>

    <div class="alert alert-error" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <div class="form-group">
            <label for="usernameOrEmail">Username or Email</label>
            <input id="usernameOrEmail" name="usernameOrEmail" type="text" required placeholder="your.username or email">
        </div>

        <div class="submit-wrapper">
            <button class="btn-primary" type="submit">Send Reset Link</button>
        </div>
    </form>

    <p class="helper-link">
        Remembered your password? <a th:href="@{/login}">Back to login</a>
    </p>
</section>
</body>
</html>
