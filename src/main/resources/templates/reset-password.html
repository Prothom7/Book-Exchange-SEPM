<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Book Exchange</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">
<div class="bg-blur"></div>
<div class="bg-circle circle-one"></div>
<div class="bg-circle circle-two"></div>

<section class="auth-card">
    <div class="brand">
        <h1>Reset Password</h1>
        <p>Choose a new password for your account.</p>
    </div>

    <div class="alert alert-error" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">

        <div class="form-group">
            <label for="password">New Password</label>
            <input id="password" name="password" type="password" required autocomplete="new-password" placeholder="Enter a strong password">
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" required autocomplete="new-password" placeholder="Repeat your new password">
        </div>

        <div class="submit-wrapper">
            <button class="btn-primary" type="submit">Reset Password</button>
        </div>
    </form>

    <p class="helper-link">
        Back to <a th:href="@{/login}">login</a>
    </p>
</section>
</body>
</html>
