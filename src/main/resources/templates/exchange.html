<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${page.title}">Book Exchange | Exchange</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/header.css}">
  <link rel="stylesheet" th:href="@{/css/footer.css}">
  <link rel="stylesheet" th:href="@{/css/exchange.css}">
</head>
<body>
  <th:block th:replace="~{fragments/header :: siteHeader(${navItems}, ${page.activePath})}"></th:block>

  <main>
    <section class="page-banner">
      <div class="container">
        <h2 th:text="${page.heading}">Manage Exchange Requests</h2>
        <p th:text="${page.description}">Track your requests and review moderation updates.</p>
      </div>
    </section>

    <section class="exchange-workspace">
      <div class="container exchange-grid">
        <article class="panel">
          <h3>My Requests</h3>
          <div id="myRequestsList" class="request-list"></div>
        </article>

        <article class="panel">
          <h3>Requests for My Books</h3>
          <div id="ownerRequestsList" class="request-list"></div>
        </article>

        <article class="panel wide-panel">
          <div class="panel-head">
            <h3>Moderator Queue</h3>
            <button id="refreshModerationBtn" class="chip-btn" type="button">Refresh Queue</button>
          </div>
          <div id="moderationRequestsList" class="request-list"></div>
        </article>
      </div>
    </section>
  </main>

  <th:block th:replace="~{fragments/footer :: siteFooter}"></th:block>
  <script th:src="@{/js/exchange.js}" defer></script>
</body>
</html>
